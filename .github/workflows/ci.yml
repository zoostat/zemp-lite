name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  words:
    name: words
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository with its full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse forbidden words in names, contents and history
        env:
          FORBIDDEN_WORDS: ${{ vars.FORBIDDEN_WORDS }}
        run: |
          if [ -z "${FORBIDDEN_WORDS}" ]; then
            echo "The repository variable FORBIDDEN_WORDS is empty or missing."
            exit 1
          fi
          failed=0

          echo "1. Tracked file and folder names"
          if git ls-files | grep -i -E -e "${FORBIDDEN_WORDS}"; then
            echo "A tracked file name contains a forbidden word (matching lines above)."
            failed=1
          fi

          echo "2. Contents of tracked text files"
          if git grep -i -I -n -E -e "${FORBIDDEN_WORDS}"; then
            echo "A tracked file contains a forbidden word (file:line:text above)."
            failed=1
          fi

          echo "3. Commit messages, author and committer names and emails, all branches and tags"
          hits=$(git log --all --format='%H' | while read -r sha; do
            git log -1 --format='%B%n%an%n%ae%n%cn%n%ce' "$sha" \
              | grep -i -E -e "${FORBIDDEN_WORDS}" \
              | sed "s/^/commit ${sha}: /" || true
          done)
          if [ -n "${hits}" ]; then
            echo "${hits}"
            echo "The history contains a forbidden word (commit and matching line above)."
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "No forbidden word found."

  routine:
    name: routine
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the pinned tools from the lock file
        run: npm ci

      - name: Format
        run: npm run check:format

      - name: Lint
        run: npm run check:lint

      - name: Type check
        run: npm run check:types

      - name: Unit tests
        run: npm run test:unit

      # The worker: the released Zeff engine, built here to WebAssembly. The compiler is the
      # one worker/rust-toolchain.toml pins, which rustup installs when it is first asked for.
      - name: Install the pinned Rust toolchain
        working-directory: worker
        run: rustup toolchain install

      - name: Keep the engine's build between runs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            worker/target
          key: worker-${{ runner.os }}-${{ hashFiles('worker/Cargo.lock', 'worker/rust-toolchain.toml', 'worker/.cargo/config.toml') }}

      - name: Keep the WebAssembly binding tool between runs
        id: tool
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.129-${{ runner.os }}

      - name: Install the WebAssembly binding tool at the pinned version
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version '=0.2.129' --locked

      - name: The worker's Rust, formatted and linted with warnings denied
        run: npm run check:rust

      - name: The worker's tests, natively
        run: npm run test:rust

      - name: Build the worker to WebAssembly
        run: npm run build:worker

      - name: The worker's messages, under a worker thread of Node
        run: npm run test:worker

      # The two browsers go into the project's own node_modules, as on a developer's machine;
      # --with-deps adds the system libraries a fresh runner lacks.
      - name: Install the test browsers (Chromium and WebKit)
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium webkit

      - name: Browser tests, in Chromium and WebKit
        run: npm run test:browser
