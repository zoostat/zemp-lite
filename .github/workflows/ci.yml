name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  words:
    name: words
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository with its full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse forbidden words in names, contents and history
        env:
          FORBIDDEN_WORDS: ${{ vars.FORBIDDEN_WORDS }}
        run: |
          if [ -z "${FORBIDDEN_WORDS}" ]; then
            echo "The repository variable FORBIDDEN_WORDS is empty or missing."
            exit 1
          fi
          failed=0

          echo "1. Tracked file and folder names"
          if git ls-files | grep -i -E -e "${FORBIDDEN_WORDS}"; then
            echo "A tracked file name contains a forbidden word (matching lines above)."
            failed=1
          fi

          echo "2. Contents of tracked text files"
          if git grep -i -I -n -E -e "${FORBIDDEN_WORDS}"; then
            echo "A tracked file contains a forbidden word (file:line:text above)."
            failed=1
          fi

          echo "3. Commit messages, author and committer names and emails, all branches and tags"
          hits=$(git log --all --format='%H' | while read -r sha; do
            git log -1 --format='%B%n%an%n%ae%n%cn%n%ce' "$sha" \
              | grep -i -E -e "${FORBIDDEN_WORDS}" \
              | sed "s/^/commit ${sha}: /" || true
          done)
          if [ -n "${hits}" ]; then
            echo "${hits}"
            echo "The history contains a forbidden word (commit and matching line above)."
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "No forbidden word found."

  routine:
    name: routine
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the pinned tools from the lock file
        run: npm ci

      - name: Format
        run: npm run check:format

      - name: Lint
        run: npm run check:lint

      - name: Type check
        run: npm run check:types

      - name: Edition check (Lite never depends on Zemp Studio; no dialog, guide or builder)
        run: npm run check:edition

      # The worker: the released Zeff engine, built here to WebAssembly. The compiler is the
      # one worker/rust-toolchain.toml pins, which rustup installs when it is first asked for.
      - name: Install the pinned Rust toolchain
        working-directory: worker
        run: rustup toolchain install

      - name: Keep the engine's build between runs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            worker/target
          key: worker-${{ runner.os }}-${{ hashFiles('worker/Cargo.lock', 'worker/rust-toolchain.toml', 'worker/.cargo/config.toml') }}

      - name: Keep the WebAssembly binding tool between runs
        id: tool
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.129-${{ runner.os }}

      - name: Install the WebAssembly binding tool at the pinned version
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version '=0.2.129' --locked

      # The Paper module: Typst, built from the released program's own lock file. Its build is
      # kept apart from the engine's, since each changes without the other.
      - name: Keep the Paper module's build between runs
        uses: actions/cache@v6
        with:
          path: paper/target
          key: paper-${{ runner.os }}-${{ hashFiles('paper/Cargo.lock', 'paper/rust-toolchain.toml', 'paper/.cargo/config.toml') }}

      - name: The Rust of the worker and of the Paper module, formatted and linted with warnings denied
        run: npm run check:rust

      - name: The tests of the worker and of the Paper module, natively
        run: npm run test:rust

      - name: Everything the Paper module links is under a permissive licence, as kept
        run: npm run check:paper

      - name: Build the worker to WebAssembly
        run: npm run build:worker

      - name: The worker's messages, under a worker thread of Node
        run: npm run test:worker

      - name: Measure the worker's compressed size and cold start (risk R4)
        run: npm run measure:worker

      # The Paper module, which is Typst: built to WebAssembly as the worker is, its messages
      # tested under Node, and its size as it travels held to the limit recorded for it.
      - name: Build the Paper module to WebAssembly
        run: npm run build:paper

      - name: The paper's worker, its messages, under a worker thread of Node
        run: npm run test:paper

      - name: Measure the Paper module as it travels, with its fonts
        run: npm run measure:paper

      - name: The engine's own sample projects, through this worker, against their expected output
        run: npm run check:samples

      - name: The engine's size as the loading screen gives it, held to this worker
        run: npm run check:facts

      # After the worker is built: one unit test runs the engine itself, to hold the figures
      # the interface asks for to the bytes the released command line writes.
      - name: Unit tests
        run: npm run test:unit

      # The two browsers go into the project's own node_modules, as on a developer's machine;
      # --with-deps adds the system libraries a fresh runner lacks.
      - name: Install the test browsers (Chromium and WebKit)
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium webkit

      - name: Browser tests, in Chromium and WebKit
        run: npm run test:browser

      # Where a browser test failed, what the page held at that moment is kept (Playwright
      # writes it under test-results/), so that the failure can be read and not guessed at.
      # Only that: the folder also holds the browsers' own profiles, hundreds of megabytes.
      - name: Keep what the page held where a browser test failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            test-results/**/error-context.md
            test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      # The build the browser tests ran on, kept for the deployment (deploy.yml), which sends
      # these very files to the host after a green run of the main branch.
      - name: Keep the tested build for the deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 30
