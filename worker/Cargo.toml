[package]
name = "zemp-worker"
description = "The Zeff engine as Zemp's worker in the browser: a project in memory, a run that tells its steps, and the files a run wrote given back."
version = "0.2.0-dev"
edition = "2024"
license = "Apache-2.0"
publish = false

# A package of its own, not a member of a workspace above it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

# The engine is the released Zeff 0.8.0, by the commit of its tag v0.8.0, and nothing else:
# Zemp uses the engine through its released versions (docs/decisions.md).
[dependencies]
zeff-engine = { git = "https://github.com/zoostat/zeff", rev = "6bfa6c55a5584e4e038fc828fef900a30f0856c3" }
zeff-diagnostics = { git = "https://github.com/zoostat/zeff", rev = "6bfa6c55a5584e4e038fc828fef900a30f0856c3" }
zeff-columns = { git = "https://github.com/zoostat/zeff", rev = "6bfa6c55a5584e4e038fc828fef900a30f0856c3" }
zeff-web = { git = "https://github.com/zoostat/zeff", rev = "6bfa6c55a5584e4e038fc828fef900a30f0856c3" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

# The profile of the Zeff repository's own release build, so that the engine here is compiled
# as the released one is (Engine Specification, section 8.3, point 3: integer overflow is
# checked in every profile; nothing fuses a multiply-add or reorders floating-point work).
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = true
debug-assertions = false

[profile.dev]
overflow-checks = true
debug = false
